<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreshMart Admin</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">
<div id="login" class="min-h-screen grid place-items-center p-4"><form id="lf" class="bg-white p-8 rounded-2xl shadow w-full max-w-sm space-y-3"><h1 class="text-2xl font-bold text-green-700">🛒 FreshMart Admin</h1><input id="em" type="email" required placeholder="Admin email" class="w-full border rounded-lg p-3"><input id="pw" type="password" required placeholder="Password" class="w-full border rounded-lg p-3"><p id="le" class="text-red-600 text-sm"></p><button class="w-full bg-green-600 text-white py-3 rounded-lg font-semibold">Log in</button></form></div>
<div id="app" class="hidden max-w-7xl mx-auto p-4">
 <div class="flex flex-wrap items-center justify-between gap-2 mb-4"><h1 class="text-2xl font-bold text-green-700">🛒 Admin Dashboard</h1><div class="flex gap-2 text-sm"><button data-t="products" class="tab px-4 py-2 rounded-lg">Products</button><button data-t="categories" class="tab px-4 py-2 rounded-lg">Categories & Discounts</button><button data-t="orders" class="tab px-4 py-2 rounded-lg">Orders</button><button data-t="settings" class="tab px-4 py-2 rounded-lg">Store Info</button><button onclick="localStorage.removeItem('atoken');location.reload()" class="px-4 py-2 rounded-lg bg-red-100 text-red-700">Logout</button></div></div>
 <div id="stats" class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4 text-sm"></div><div id="view"></div></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let T=localStorage.getItem('atoken'),cats=[],prods=[],orders=[],tab='products';
async function api(p,o={}){const h={Authorization:'Bearer '+T};let b=o.body;if(b&&!(b instanceof FormData)){h['Content-Type']='application/json';b=JSON.stringify(b);}
 const r=await fetch('/api'+p,{...o,headers:h,body:b});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Error');return d;}
$('#lf').onsubmit=async e=>{e.preventDefault();try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('#em').value,password:$('#pw').value})});const d=await r.json();
 if(!r.ok)throw new Error(d.error);if(d.user.role!=='admin')throw new Error('Not an admin account');T=d.token;localStorage.setItem('atoken',T);start();}catch(x){$('#le').textContent=x.message;}};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();});
async function start(){try{await api('/auth/me');}catch{return;}$('#login').classList.add('hidden');$('#app').classList.remove('hidden');await load();}
async function load(){[cats,prods,orders]=await Promise.all([api('/categories'),api('/products'),api('/admin/orders')]);render();}
function render(){document.querySelectorAll('.tab').forEach(b=>b.className='tab px-4 py-2 rounded-lg '+(b.dataset.t===tab?'bg-green-600 text-white':'bg-white'));
 $('#stats').innerHTML=[['Products',prods.length],['Out of stock',prods.filter(p=>p.stock<=0).length],['Orders',orders.length],['Revenue','Rs. '+orders.filter(o=>o.status!=='Cancelled').reduce((s,o)=>s+o.total,0).toLocaleString()]].map(([a,b])=>`<div class="bg-white rounded-xl p-4 shadow-sm"><p class="text-slate-500">${a}</p><p class="text-2xl font-bold">${b}</p></div>`).join('');
 ({products:vProducts,categories:vCats,orders:vOrders,settings:vSettings})[tab]();}
const inp='border rounded-lg p-2 w-full';
function vProducts(){$('#view').innerHTML=`<form id="pf" class="bg-white rounded-xl p-4 shadow-sm grid grid-cols-2 md:grid-cols-4 gap-2 mb-4 text-sm"><input type="hidden" id="pid"><input id="pn" required placeholder="Name" class="${inp}"><select id="pc" class="${inp}">${cats.map(c=>`<option>${E(c.name)}</option>`).join('')}</select><input id="pp" type="number" min="1" required placeholder="Price" class="${inp}"><input id="pd" type="number" min="0" max="90" placeholder="Discount %" class="${inp}"><input id="ps" type="number" min="0" required placeholder="Stock" class="${inp}"><input id="pde" placeholder="Description" class="${inp} md:col-span-2"><input id="pdt" placeholder="Details" class="${inp}"><input id="pim" type="file" accept="image/*" class="${inp}"><p id="pe" class="text-red-600 col-span-2"></p><button class="bg-green-600 text-white rounded-lg p-2 font-semibold md:col-span-2" id="pb">Add product</button></form>
 <div class="bg-white rounded-xl shadow-sm overflow-x-auto"><table class="w-full text-sm"><thead class="bg-slate-50 text-left"><tr><th class="p-3">Product</th><th>Category</th><th>Price</th><th>Disc.</th><th>Stock</th><th></th></tr></thead><tbody>${prods.map(p=>`<tr class="border-t"><td class="p-3 font-medium">${E(p.name)}</td><td>${E(p.category)}</td><td>${p.price}</td><td>${p.discount}%</td><td class="${p.stock<=0?'text-red-600 font-semibold':''}">${p.stock<=0?'Out of stock':p.stock}</td><td class="whitespace-nowrap"><button onclick="edit('${p.id}')" class="text-blue-600 mr-2">Edit</button><button onclick="del('${p.id}')" class="text-red-600">Delete</button></td></tr>`).join('')}</tbody></table></div>`;
 $('#pf').onsubmit=async e=>{e.preventDefault();const f=new FormData();[['name','pn'],['category','pc'],['price','pp'],['discount','pd'],['stock','ps'],['description','pde'],['details','pdt']].forEach(([k,i])=>f.append(k,$('#'+i).value));if($('#pim').files[0])f.append('image',$('#pim').files[0]);
  try{const id=$('#pid').value;await api(id?'/products/'+id:'/products',{method:id?'PUT':'POST',body:f});await load();}catch(x){$('#pe').textContent=x.message;}};}
window.edit=id=>{const p=prods.find(x=>x.id===id);$('#pid').value=id;$('#pn').value=p.name;$('#pc').value=p.category;$('#pp').value=p.price;$('#pd').value=p.discount;$('#ps').value=p.stock;$('#pde').value=p.description;$('#pdt').value=p.details;$('#pb').textContent='Save changes';scrollTo(0,0);};
window.del=async id=>{if(confirm('Delete this product?')){await api('/products/'+id,{method:'DELETE'});load();}};
function vCats(){$('#view').innerHTML=`<div class="grid md:grid-cols-2 gap-4"><div class="bg-white rounded-xl p-4 shadow-sm"><h2 class="font-bold mb-2">Categories</h2>${cats.map(c=>`<div class="flex justify-between border-b py-2">${c.emoji} ${E(c.name)}<button onclick="dc('${c.id}')" class="text-red-600 text-sm">Delete</button></div>`).join('')}<form id="cf" class="flex gap-2 mt-3 text-sm"><input id="cn" required placeholder="New category" class="${inp}"><input id="ce" placeholder="🙂" class="${inp} w-16"><button class="bg-green-600 text-white px-3 rounded-lg">Add</button></form><p id="ce2" class="text-red-600 text-sm"></p></div>
 <div class="bg-white rounded-xl p-4 shadow-sm"><h2 class="font-bold mb-2">Bulk discount by category</h2><form id="df" class="space-y-2 text-sm"><select id="dc2" class="${inp}">${cats.map(c=>`<option>${E(c.name)}</option>`).join('')}</select><input id="dv" type="number" min="0" max="90" required placeholder="Discount % (0 removes)" class="${inp}"><button class="bg-orange-500 text-white px-4 py-2 rounded-lg">Apply discount</button></form></div></div>`;
 $('#cf').onsubmit=async e=>{e.preventDefault();try{await api('/categories',{method:'POST',body:{name:$('#cn').value,emoji:$('#ce').value}});load();}catch(x){$('#ce2').textContent=x.message;}};
 $('#df').onsubmit=async e=>{e.preventDefault();await api('/discounts/bulk',{method:'POST',body:{category:$('#dc2').value,discount:$('#dv').value}});alert('Discount applied');load();};}
window.dc=async id=>{try{await api('/categories/'+id,{method:'DELETE'});load();}catch(x){alert(x.message);}};
function vOrders(){$('#view').innerHTML=orders.length?orders.map(o=>`<div class="bg-white rounded-xl p-4 shadow-sm mb-3 text-sm"><div class="flex flex-wrap justify-between gap-2"><b>${E(o.id)} · ${E(o.customer)}</b><select onchange="st('${o.id}',this.value)" class="border rounded p-1">${['Pending','Processing','Out for delivery','Delivered','Cancelled'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></div><p class="text-slate-500">${new Date(o.createdAt).toLocaleString()} · ${E(o.phone)} · ${E(o.payment)}</p><p>${E(o.address)}</p><p class="mt-1">${o.lines.map(l=>l.qty+'× '+E(l.name)).join(', ')}</p><p class="font-bold mt-1">Total: Rs. ${o.total.toLocaleString()}</p></div>`).join(''):'<p class="text-center text-slate-500 py-10">No orders yet.</p>';}
window.st=async(id,status)=>{await api('/admin/orders/'+id,{method:'PUT',body:{status}});load();};
async function vSettings(){const s=await fetch('/api/settings').then(r=>r.json());$('#view').innerHTML=`<form id="sf" class="bg-white rounded-xl p-4 shadow-sm space-y-2 text-sm max-w-2xl">${Object.keys(s).map(k=>`<label class="block capitalize font-semibold">${k}<textarea name="${k}" class="${inp} font-normal">${E(s[k])}</textarea></label>`).join('')}<p class="text-slate-500">These texts are used by the chatbot for delivery, timings, payments, returns and contact answers.</p><button class="bg-green-600 text-white px-4 py-2 rounded-lg">Save</button></form>`;
 $('#sf').onsubmit=async e=>{e.preventDefault();await api('/settings',{method:'PUT',body:Object.fromEntries(new FormData(e.target))});alert('Saved');};}
if(T)start();
</script></body></html>
